name: "LLM Drift & Build Error Report"
description: "Submit a verified LLM hallucination / compiler build error fix to enrich the doc-engine knowledge base"
title: "[Drift Fix]: <Library> - <Short Summary of Error>"
labels: ["llm-drift", "curated-entry", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the **zig-doc-engine** knowledge flywheel!
        Please share verified compiler error diagnostics and their 100% working modern solutions.

  - type: input
    id: library_version
    attributes:
      label: Target Library & Exact Version
      description: e.g., Zig v0.16.0, Rust Axum v0.8.1, React v19.0.0, Next.js v15.1.0
      placeholder: "Zig v0.16.0"
    validations:
      required: true

  - type: textarea
    id: error_symptom
    attributes:
      label: ❌ Compiler / Build Error Diagnostic
      description: Paste the exact compiler error output or failure message.
      placeholder: |
        build.zig:17:28: error: no field named 'root_source_file' in struct 'std.Build.ExecutableOptions'
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: 🔍 Root Cause / Outdated LLM Pattern
      description: Explain what deprecated API or outdated pattern the LLM generated.
      placeholder: |
        LLMs trained on Zig 0.11-0.13 emit `b.addExecutable(.{ .root_source_file = ... })` instead of modern `b.createModule(...)` + `.root_module`.
    validations:
      required: true

  - type: textarea
    id: working_solution
    attributes:
      label: ✅ Verified Working Code / Configuration
      description: Provide the complete, compilable fix verified with Exit Code 0.
      placeholder: |
        ```zig
        const mod = b.createModule(.{
            .root_source_file = b.path("src/main.zig"),
            .target = target,
            .optimize = optimize,
        });
        const exe = b.addExecutable(.{
            .name = "app",
            .root_module = mod,
        });
        ```
    validations:
      required: true

  - type: checkboxes
    id: sanitization_check
    attributes:
      label: Privacy & Verification Confirmation
      options:
        - label: "I have verified this fix compiles cleanly (Exit Code 0) on the target version."
          required: true
        - label: "I have sanitized all personal usernames, internal paths, and company secrets."
          required: true
